[project]
name = "datos-censales-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "geopandas>=1.1.4",
    "gunicorn>=26.2.0",
    "mapclassify>=2.11.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
datagen = [
    "cudf-cu13==26.10.*",
    "h3>=4.5.0",
    "tobler>=0.14.0",
    "tqdm>=4.70.1",
]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "ruff>=0.16.5",
]

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "-all"

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"
