[project]
name = "datos-censales-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi[standard]>=0.163.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "geopandas>=1.1.4",
    "mapclassify>=2.11.0",
    "orjson>=3.13.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "quackosm>=0.20.0",
    "requests>=2.34.2",
]

[dependency-groups]
datagen = [
    "h3>=4.5.0",
    "tobler>=0.14.0",
    "tqdm>=4.70.1",
]
dev = [
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.5",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "ruff>=0.16.5",
]

[tool.fastapi]
entrypoint = "app:app"

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "-all"
