services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/data:/app/data
    expose:
      - "5000"
    restart: unless-stopped
    environment:
          - UV_PROJECT_ENVIRONMENT=/app/.venv-docker

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped